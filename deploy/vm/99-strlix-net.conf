# /etc/sysctl.d/99-strlix-net.conf (perf1)
# The stream is bursty: a static phone screen sends nothing, then a tap sends a
# burst of frames. Linux resets cwnd to the initial window after every idle gap,
# so each burst after idle re-did slow start (extra round trips on a 200+ ms path).
net.ipv4.tcp_slow_start_after_idle = 0
# BBR + fq pacing: steadier latency under loss on long paths than cubic.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
