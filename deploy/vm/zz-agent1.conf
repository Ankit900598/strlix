# Viewer Ask bridge (desktop-api POST /chat -> android-api). Installed as
# /etc/systemd/system/strlix-desktop-api.service.d/zz-agent1.conf
# Server-to-server: talk to the android-api origin directly (no WAF/AFD hop).
[Service]
Environment=ANDROID_API_URL=https://ca-android-api.livelytree-f43ff378.centralindia.azurecontainerapps.io
Environment=AGENT_MAX_ROUNDS=3
Environment=AGENT_CHAT_PER_MIN=12
