# /etc/systemd/system/strlix-desktop-api.service.d/zz-normal1.conf
# Normal-feel stream profile (2026-10-01). Sorts after zz-gaming1/zz-play1 so it wins.
# Keeps the latency knobs (640 long edge, 1.8 Mbps, 30 fps cap, 5 ms flush) and
# removes the gaming-era encoder restarts on a static screen.
[Service]
Environment=H264_IDR_STALE_RESTART=0
Environment=H264_INPUT_NOFRAME_S=2.5
Environment=H264_IDR_WATCHDOG_S=4.0
Environment=H264_KEYFRAME_COOLDOWN_S=3.5
Environment=INPUT_RATE_PER_SEC=240
ExecStartPost=-/usr/bin/timeout 20 /home/azureuser/strlix/scripts/normal-feel-profile.sh emulator-5554
