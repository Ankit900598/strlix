[project]
name = "strlix-android-api"
version = "0.1.1"
description = "Strlix Android in-phone backend — chat, voice, agent tools (NO ADB stream)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "openai>=1.55.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  "pydantic>=2.0.0",
  "strlix-common",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["android_api*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
