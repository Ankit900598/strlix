[project]
name = "strlix-market-api"
version = "0.4.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "PyJWT>=2.8",
  "python-multipart>=0.0.9",
  "email-validator>=2.0",
  "psycopg[binary]>=3.1",
  "redis>=5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["market_api*"]
